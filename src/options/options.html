<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./options.css" />
    <script type="module" src="./options.js"></script>
    <title i18n="optionstitle">Options - Bookmarker for Nextcloud</title>
  </head>

  <body>
    <div id="header">
      <h1
        class="text-wrap-balance z-0 mt-0 mb-10 pt-[40px] text-center text-5xl leading-tight font-medium text-sky-400"
        i18n-data="optionsheader"
      >
        Options - Bookmarker for Nextcloud
      </h1>
    </div>

    <div id="container" class="z-10 ps-[80px] pe-[80px]">
      <div id="clickarea">
        <div
          id="tabs"
          class="tabs tabs-border tabs-lg hover:accent-primary pb-2"
        >
          <a
            id="tab_basic"
            class="tab-border tab-lg tab hover:bg-sky-400"
            i18n-data="basic"
            >Basic</a
          >
          <a id="tab_zen" class="tab-border tab-lg tab" i18n-data="zen">Zen</a>
          <a id="tab_ai" class="tab-border tab-lg tab">AI</a>
          <a
            id="tab_advanced"
            class="tab-border tab-lg tab"
            i18n-data="advanced"
            >Advanced</a
          >
          <a id="tab_dev" class="tab-border tab-lg tab" i18n-data="development"
            >Development</a
          >
        </div>
        <div id="content" class="p-2 text-lg">
          <!--- ---------------------------------------------------------------- -->
          <div id="content_tab_basic" class="hidden delay-100">
            <div>
              <input
                type="checkbox"
                id="cbx_displayFolders"
                class="toggle toggle-info toggle-xs"
              />
              <label for="cbx_displayFolders" i18n-data="displayFolders"
                >Display Folders</label
              >
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_autoTags"
                class="toggle toggle-info toggle-xs"
              />
              <label i18n-data="autotags" for="cbx_autoTags">Auto tags</label>
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_autoDescription"
                class="toggle toggle-info toggle-xs"
              />
              <label i18n-data="autodescription" for="cbx_autoDescription"
                >Auto description</label
              >
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_successMessage"
                class="toggle toggle-info toggle-xs"
              />
              <label i18n-data="successnotification" for="cbx_successMessage">
                Display success notification
              </label>
            </div>
          </div>
          <!--- --------------------------------------------------------------- -->
          <div id="content_tab_zen" class="hidden delay-100">
            <div>
              <input
                type="checkbox"
                id="cbx_enableZen"
                class="toggle toggle-info toggle-xs"
              />
              <label for="cbx_enableZen" i18n-data="enableZen"
                >Enable Zen Mode</label
              >
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_zenDisplayNotification"
                class="toggle toggle-info toggle-xs"
              />
              <label
                for="cbx_zenDisplayNotification"
                i18n-data="zenDisplayNotification"
                >Display notification in Zen Mode</label
              >
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_zenUseAi"
                class="toggle toggle-info toggle-xs"
              />
              <label for="cbx_zenUseAi" i18n-data="zenUseAi"
                >Use AI for missing tags and description</label
              >
            </div>
            <div
              class="mt-3 grid grid-cols-[max-content_1fr] items-center gap-x-6 gap-y-2"
            >
              <label for="input_zenKeywords" i18n-data="zenkeywords"
                >Zen Keywords</label
              >
              <input
                type="text"
                class="input input-sm input-info w-[350px]"
                id="input_zenKeywords"
                autocomplete="off"
              />
              <label for="zen_folders" class="self-start pt-2"
                >Zen Folders</label
              >
              <select
                size="5"
                multiple
                class="select select-info block! w-[350px]"
                id="zen_folders"
              >
                <option>Root</option>
              </select>
            </div>
          </div>
          <!--- ---------------------------------------------------------------- -->
          <div id="content_tab_ai" class="hidden delay-100">
            <div
              id="ai_providers"
              class="mt-3 flex flex-wrap gap-2"
              role="radiogroup"
              aria-label="AI provider"
            ></div>
            <div id="ai_panels"></div>
            <div class="mt-4">
              <input
                type="checkbox"
                id="cbx_aiTags"
                class="toggle toggle-info toggle-xs"
              />
              <label for="cbx_aiTags" i18n-data="aiTags"
                >Suggest tags with AI</label
              >
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_aiDescription"
                class="toggle toggle-info toggle-xs"
              />
              <label for="cbx_aiDescription" i18n-data="aiDescription"
                >Suggest description with AI</label
              >
            </div>
            <p class="mt-2 text-sm opacity-70" i18n-data="aiPrivacyNote">
              If the page offers no tags or description, its title, URL and an
              excerpt of its text are sent to the selected provider.
            </p>
            <div class="text-error hidden" id="ai_error"></div>
            <div id="ai_usage" class="mt-6"></div>
          </div>
          <!--- ---------------------------------------------------------------- -->
          <div id="content_tab_advanced" class="content hidden">
            <div>
              <input
                type="checkbox"
                id="cbx_alreadyStored"
                class="toggle toggle-info toggle-xs"
              />
              <label i18n-data="alreadyStored" for="cbx_alreadyStored"
                >Check for stored bookmarks</label
              >
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_showUrl"
                class="toggle toggle-info toggle-xs"
              />
              <label i18n-data="showUrl" for="cbx_showUrl">Show Url</label>
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_showDescription"
                class="toggle toggle-info toggle-xs"
              />
              <label i18n-data="showDescription" for="cbx_showDescription"
                >Show Description</label
              >
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_showKeywords"
                class="toggle toggle-info toggle-xs"
              />
              <label i18n-data="showKeywords" for="cbx_showKeywords"
                >Show Keywords</label
              >
            </div>
            <div>
              <input
                type="checkbox"
                id="cbx_extendedKeywords"
                class="toggle toggle-info toggle-xs"
              />
              <label i18n-data="extendedKeywords" for="cbx_extendedKeywords"
                >User extended keyword detection</label
              ><br />
              <div class="flex flex-row">
                <label
                  for="input_headings_slider"
                  i18n-data="searchDepth"
                  class="ps-8"
                  >Search depth</label
                >
                <div class="ps-2">
                  <input
                    type="range"
                    min="1"
                    max="6"
                    value="3"
                    class="range range-info range-xs"
                    step="1"
                    id="input_headings_slider"
                  />
                  <div
                    id="heading_selectors"
                    class="flex w-full justify-between px-2 text-xs"
                  >
                    <span class="heading_selector" id="1">1</span>
                    <span class="heading_selector" id="2">2</span>
                    <span class="heading_selector" id="3">3</span>
                    <span class="heading_selector" id="4">4</span>
                    <span class="heading_selector" id="5">5</span>
                    <span class="heading_selector" id="6">6</span>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-y-1">
                <label for="input_networkTimeout" i18n-data="networkTimeout"
                  >Network Timeout</label
                >
                <div class="ps-2">
                  <input
                    type="number"
                    id="input_networkTimeout"
                    min="1"
                    max="120"
                    step="1"
                  />
                </div>
                <div></div>
                <div i18n-data="networkTimeoutNote" class="ps-2 text-xs">
                  (defaults to 10 seconds if not set)
                </div>
              </div>
              <br />
            </div>
          </div>
          <!--- Development tab ------------------------------------------------ -->
          <!--- ---------------------------------------------------------------- -->
          <div id="content_tab_dev" class="hidden delay-100">
            <button
              id="btn_clear_all_data"
              class="btn btn-info"
              i18n-data="clearall"
            ></button>

            <button
              id="btn_reset_options"
              class="btn btn-info"
              i18n-data="resetoptions"
            ></button>

            <button
              id="btn_clear_cache"
              class="btn btn-info"
              i18n-data="clearcache"
            ></button>

            <button
              id="btn_forget_credentials"
              class="btn btn-warning"
              i18n-data="forgetcredentials"
            ></button>

            <button
              id="btn_show_options"
              class="btn btn-warning"
              i18n-data="showoptions"
            ></button>

            <button
              id="btn_show_cache"
              class="btn btn-warning"
              i18n-data="showcache"
            ></button>

            <div class="mt-[20px]">
              <label for="input_dbVersion">Create old database:</label>
              <input type="number" id="input_dbVersion" class="ms-1 w-24" />
              <button id="btn_create_db" class="btn btn-info btn-xs ms-1">
                Create
              </button>
            </div>

            <div class="mt-[20px]">
              <input
                type="checkbox"
                id="cbx_reduceKeywords"
                class="toggle toggle-info toggle-xs"
              />
              <label for="cbx_reduceKeywords" i18n-data="reduceKeywords"
                >Reduce Keywords</label
              >
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="absolute start-5 top-5 z-0"></div>
  </body>
</html>
